name: IDMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend Build Check ────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Check bundle size
        run: |
          echo "── Build output ──"
          du -sh dist/
          echo ""
          echo "── Largest chunks ──"
          find dist/assets -name "*.js" -exec du -h {} + | sort -rh | head -10

  # ── Backend Build Check ─────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idms-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: idms-backend/package-lock.json

      - run: npm ci

      - name: Verify models load
        run: node -e "require('./src/models/index'); console.log('✅ All models loaded successfully')"
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-characters-long
          FIREBASE_PROJECT_ID: test
          FIREBASE_PRIVATE_KEY: test
          FIREBASE_CLIENT_EMAIL: test@test.com
          FIREBASE_DATABASE_URL: https://test.firebaseio.com
          MQTT_BROKER_URL: mqtts://test:8883
          MQTT_USERNAME: test
          MQTT_PASSWORD: test
          FRONTEND_URL: http://localhost:5173
          NODE_ENV: test

  # ── ML Service Check ────────────────────────────────────────────────────
  check-ml:
    name: Check ML Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idms-ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: idms-ml/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verify Flask app imports
        run: python -c "from app import app; print('✅ Flask app loaded successfully')"
        env:
          MONGODB_URI: mongodb://localhost:27017/test
